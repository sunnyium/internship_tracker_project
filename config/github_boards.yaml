# =============================================================================
# GitHub Job-Board Watcher - repositories and settings
# =============================================================================
#
# Read only by github_boards/ and run_github_boards.py. Nothing in tracker/
# touches this file, and this file never names a company career page - the
# two halves of the project are deliberately independent.
#
# Each entry under `repos` describes one crowdsourced internship list living
# in a GitHub repository. The `strategy` says how that repo stores its jobs:
#
#   json      a machine-readable listings file (the Simplify/vanshb03 schema)
#   markdown  GitHub-flavoured tables inside .md files
#   yaml_dir  one YAML file per company in a directory
#   auto      try the known json paths, then fall back to markdown on README.md
#
# Per-repo keys, all optional unless noted:
#
#   name                     what shows up in notifications and the database
#   repo                     "owner/name" (required)
#   strategy                 one of the four above (required)
#   branch                   defaults to HEAD, which follows the default branch
#   paths                    files to read, in order; defaults per strategy
#   dir                      yaml_dir only - directory holding the YAML files
#   require_internship_title turn off for lists of programs/fellowships whose
#                            titles don't contain the word "intern"
#   keyword_match            turn off for lists that are already entirely
#                            on-topic (AI-only, quant-only), where requiring a
#                            keyword would drop good roles for phrasing reasons
#   max_files                yaml_dir only - cap on how many files to pull

settings:
  # Postings older than this are ignored where the repo publishes a date.
  # Rows with no parseable date are KEPT, and "not seen before" is what keeps
  # those from repeating. 1 = the past day, matching the career-page half.
  max_posting_age_days: 1

  # Repos fetched at the same time. Small on purpose: one of these files is
  # 10MB, and all of them come from two hosts (raw.githubusercontent.com and
  # api.github.com).
  max_fetch_workers: 4

  # Log every posting that was examined and rejected, not just a per-repo
  # summary. Useful when tuning keywords; far too noisy for scheduled runs.
  verbose_logging: false

  # Same fields of interest the career-page tracker uses: Data Science,
  # Computational and Applied Mathematics, Computer Science, Statistics, plus
  # AI/ML, cybersecurity, finance and analyst work. These lists carry a title
  # and a location and nothing else, so there is no description to fall back
  # on - the list is a little wider than config.yaml's for that reason.
  keywords:
    - "forward deployed"
    - "data science"
    - "data scientist"
    - "data analyst"
    - "data engineer"
    - "data"
    - "analytics"
    - "analyst"
    - "machine learning"
    - "artificial intelligence"
    - "ai/ml"
    - " ai "
    - "ml engineer"
    - "deep learning"
    - "llm"
    - "nlp"
    - "computer vision"
    - "research"
    - "algorithm"
    - "software engineer"
    - "software engineering"
    - "software developer"
    - "computer science"
    - "mathematics"
    - "statistics"
    - "statistical"
    - "quant"
    - "quantitative"
    - "trading"
    - "trader"
    - "finance"
    - "financial"
    - "risk"
    - "actuarial"
    - "cybersecurity"
    - "cyber security"
    - "security"
    - "business intelligence"
    - "business analyst"

  internship_title_hints:
    - "intern"
    - "internship"
    - "co-op"
    - "coop"
    - "student researcher"
    - "student research"
    - "summer analyst"
    - "student"

  location_filter:
    enabled: true
    allowed_regions: ["US", "CA"]

  degree_filter:
    enabled: true

  # Excludes postings that EXPLICITLY name a cycle not in this list (Fall,
  # Winter, Spring) and never mention an allowed one anywhere in the title,
  # notes or the repo's own term/season column. Not naming a season at all
  # is KEPT - fail-open, same as everything else here. A bare season word in
  # free text only counts next to a year, so office locations like "Fall
  # River, MA" can't trip this; a structured term column is trusted as-is.
  term_filter:
    enabled: true
    allowed_terms: ["summer"]
    # Same rule as config/config.yaml's term_filter.allowed_years.
    allowed_years: [2027, 2028]

  # Drops postings that state a US-citizenship or security-clearance
  # requirement. Unlike every other filter here this one fails CLOSED, because
  # it is the one constraint in the candidate profile that is truly binary -
  # a Canadian citizen on an F-1 cannot take a cleared role at any price.
  citizenship_filter:
    enabled: true

notifications:
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    # Credentials come from .env (EMAIL_FROM_ADDRESS, EMAIL_APP_PASSWORD,
    # EMAIL_TO_ADDRESS) - the same three the career-page tracker uses.

  ntfy:
    enabled: true
    # Deliberately the same topic the career-page tracker publishes to, so one
    # phone subscription covers both. Message titles are prefixed "GitHub
    # boards" so it stays obvious which half sent what.
    topic: "sunny-intern-alerts-k4mq7wz2xr9t"
    server: "https://ntfy.sh"
    # Fires every round: a digest when there are matches, a quiet low-priority
    # heartbeat when there aren't, so silence means something broke.
    heartbeat: true

# -----------------------------------------------------------------------------
# The repositories
# -----------------------------------------------------------------------------
# Chosen against docs/CANDIDATE_PROFILE.md: undergraduate, Summer 2027, US and
# Canada, AI/ML first, then data science and analytics, then quant and finance,
# with Canadian programs called out as a specific plus rather than a fallback.
# Star counts and freshness were checked on 2026-08-09; see
# docs/GITHUB_BOARDS.md for why each one is here.

repos:
  # ===========================================================================
  # 1. Overall lists - broad US coverage, every field
  # ===========================================================================
  - name: "Simplify Summer 2027"
    repo: "SimplifyJobs/Summer2027-Internships"
    strategy: json
    paths: [".github/scripts/listings.json"]

  - name: "vanshb03 Summer 2027"
    repo: "vanshb03/Summer2027-Internships"
    strategy: json
    paths: [".github/scripts/listings.json"]

  - name: "SpeedyApply SWE 2027"
    repo: "speedyapply/2027-SWE-College-Jobs"
    strategy: markdown
    paths: ["README.md"]

  - name: "Zapply Internships 2027"
    repo: "zapplyjobs/Internships-2027"
    strategy: markdown
    paths: ["README.md"]

  - name: "Internship Engine 2027"
    repo: "zshah101/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships"
    strategy: markdown
    paths: ["README.md"]

  - name: "sndsh404 Summer 2027"
    repo: "sndsh404/summer-2027-internships"
    strategy: markdown
    paths: ["README.md"]

  # The largest list configured by a wide margin - roughly 17,000 rows, and
  # despite the ECE in its name the contents are general tech.
