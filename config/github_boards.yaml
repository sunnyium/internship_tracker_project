    repo: "speedyapply/2027-AI-College-Jobs"
    strategy: markdown
    paths: ["README.md"]
    # Every row in this repo is already an AI/ML role.
    keyword_match: false

  - name: "Jobright Data Analysis"
    repo: "jobright-ai/2026-Data-Analysis-Internship"
    strategy: markdown
    paths: ["README.md"]

  - name: "Jobright Software Engineer"
    repo: "jobright-ai/2026-Software-Engineer-Internship"
    strategy: markdown
    paths: ["README.md"]

  - name: "Jobright Business Analyst"
    repo: "jobright-ai/2026-Business-Analyst-Internship"
    strategy: markdown
    paths: ["README.md"]

  - name: "Jobright Engineering"
    repo: "jobright-ai/2026-Engineer-Internship"
    strategy: markdown
    paths: ["README.md"]

  - name: "Jobright Accounting & Finance"
    repo: "jobright-ai/2026-Account-Internship"
    strategy: markdown
    paths: ["README.md"]

  - name: "Jobright Consulting"
    repo: "jobright-ai/2026-Consultant-Internship"
    strategy: markdown
    paths: ["README.md"]

  - name: "Jobright Product Management"
    repo: "jobright-ai/2026-Product-Management-Internship"
    strategy: markdown
    paths: ["README.md"]

  - name: "NUFT Quant 2027"
