    strategy: markdown
    paths: ["README.md"]

  - name: "Zapply Canada Internships 2027"
    repo: "zapplyjobs/Canada-Internships-2027"
    strategy: markdown
    paths: ["README.md"]

  - name: "Francklin Canada internships"
    repo: "Francklin9999/canada-internship"
    strategy: markdown
    paths: ["README.md"]

  - name: "Krishpraj Canadian 2026"
    repo: "Krishpraj/Canadian_Internships_2026"
    strategy: markdown
    paths: ["README.md"]

  - name: "hanzili Canada co-ops"
