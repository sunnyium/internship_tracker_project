    strategy: markdown
    paths: ["README.md"]

  - name: "Surya internship tracker"
    repo: "SuryaHarikrishnan/internship-tracker"
    strategy: json
    paths: ["data/listings.json"]

  - name: "aprameyak 2027 tech jobs"
