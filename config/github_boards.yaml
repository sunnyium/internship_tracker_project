    strategy: json
    paths: ["listings.json"]

  - name: "Chieler Summer 2027 SWE"
    repo: "Chieler/Summer-2027-SWE-Internships"
    strategy: markdown
    paths: ["README.md"]

  - name: "DereC4 internships"
    repo: "DereC4/internships-and-newgrad"
    strategy: markdown
    paths: ["README.md"]

  - name: "Southeast tech internships"
    repo: "ctsc/southeast-tech-internships-2026-2027"
    strategy: markdown
    paths: ["README.md"]

  - name: "Dreamwork Tech 2027"
    repo: "dreamworkhq/Tech-Internships-2027"
    strategy: json
    paths: ["data/listings.json"]

  - name: "ForgeApply internships"
    repo: "forgeapply/internships-and-new-grad-jobs"
    strategy: markdown
    paths: ["README.md"]

  - name: "ApplyGuy 2027"
    repo: "ApplyGuy/2027-Internships"
    strategy: markdown
    paths: ["README.md"]

  # Mostly European, kept because the ~100 US rows in it are AI, data and
  # security roles the bigger lists are slower to pick up. The location filter
  # handles the rest.
  - name: "Resumax tech internships"
    repo: "resumax/tech-internships"
    strategy: markdown
    paths: ["README.md"]

  - name: "Summer 2026 curated US"
    repo: "summer2026internships/Summer2026-Internships"
    strategy: json
    paths: [".github/scripts/listings.json"]

  - name: "Edamame 2027"
    repo: "Edamame-Labs/2027-internship-jobs"
    strategy: markdown
    paths: ["README.md"]

  - name: "NYC internships"
    repo: "kazisean/nyc-internship-2026"
    strategy: markdown
