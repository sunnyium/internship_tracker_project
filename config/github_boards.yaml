  # ===========================================================================
  # 4. Underclassmen - freshman and sophomore eligible
  # ===========================================================================
  # Summer 2027 is Sunny's sophomore summer, which is the year the big lists
  # implicitly skip: their rows assume a penultimate-year student. These four
  # exist specifically for the year below that.
  - name: "Underclassmen internships"
    repo: "zapplyjobs/underclassmen-internships"
    strategy: markdown
