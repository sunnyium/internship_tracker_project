# =============================================================================
# Companies to scrape
# =============================================================================
# This is the file you'll actually edit as you add companies - keeps the
# growing company list separate from config.yaml's settings (keywords,
# notifications, etc.), which you'll touch far less often.
#
# type: auto | greenhouse | lever | workday | generic_html | apple | oracle_cloud | eightfold | amazon | google | phenom
#
# "auto" tries to figure out the platform from just a URL - known patterns
# first (Greenhouse/Lever/Workday/Apple), then content signatures
# (Phenom/Oracle/Eightfold), then a generic heuristic scrape as a last
# resort. Try this FIRST for any new company - only reach for a specific
# type below if auto-detection doesn't work for that site (see README's
# "Configure your sources" section for details on each type's options).
#
# -----------------------------------------------------------------------------
# How the types below were chosen
# -----------------------------------------------------------------------------
# Entries where the platform is readable straight off the URL (myworkdayjobs
# .com, greenhouse.io, oraclecloud.com) use that explicit type. Everything
# else is "auto" so the scraper can sniff the platform itself.
#
# Explicit types were originally also guessed from URL *shape* (the Eightfold
# "?domain=&start=&pid=" query, the Phenom "/search-results" + "pagesize=20"
# query). A real run showed those guesses failing hard: an explicit type that
# guesses wrong aborts the source, while "auto" tries the platform sniff, then
# a plain scrape, then a headless browser. Those 23 entries are now "auto" and
# say so - their old platform keys are kept below as hints.
#
# Lines marked "# guess:" are inferences, not URL facts - if one of those
# sources errors or returns 0 jobs, that line is the first thing to change.
# Lines marked "# verified:" were tested against the live site.
# Lines marked "# KNOWN BROKEN" are understood failures, left in deliberately.

sources:
  # ---------------------------------------------------------------------------
  # Tech / consumer
  # ---------------------------------------------------------------------------
  - type: greenhouse
    name: "Robinhood"
    slug: "robinhood"          # guess: careers.robinhood.com is a Greenhouse-backed board

  - type: greenhouse
    name: "Waymo"
    slug: "waymo"              # guess: careers.withwaymo.com is a Greenhouse-backed board

  - type: auto
    name: "Twilio"
    url: "https://jobs.twilio.com/careers?start=0&pid=1099554928347&sort_by=timestamp"
    # Was type: eightfold - errored on every round, so it now takes the full auto
    # chain instead (platform sniff, then browser fallback). Keys below are kept
    # as hints for whichever platform the sniff lands on.
    careers_url: "https://jobs.twilio.com/careers?start=0&pid=1099554928347&sort_by=timestamp"
    domain: "twilio.com"       # not in the URL's query string, so set explicitly
    query: "intern"

  - type: greenhouse
    name: "Okta"
    slug: "okta"               # guess: okta.com/company/careers embeds a Greenhouse board

  - type: greenhouse
    name: "Cloudflare"
    slug: "cloudflare"         # guess: cloudflare.com/careers/jobs embeds a Greenhouse board

  - type: browser
    name: "Atlassian"
    url: "https://www.atlassian.com/company/careers/all-jobs"
    # Verified: 207 jobs. Its list sometimes loses the race with the default
    # wait, and Atlassian throttles rapid repeat renders - an occasional
    # "found no job-shaped links" round for this source is expected.
    wait_after_load_ms: 6000

  - type: browser
    name: "Dropbox"
    url: "https://www.dropbox.jobs/en/jobs/"      # verified: 20 jobs

  - type: auto
    name: "Pinterest"
    url: "https://www.pinterestcareers.com/jobs/?search=&pagesize=20"
    # Was type: phenom - errored on every round, so it now takes the full auto
    # chain instead (platform sniff, then browser fallback). Keys below are kept
    # as hints for whichever platform the sniff lands on.
    domain: "www.pinterestcareers.com"
    query: "intern"

  - type: browser
    name: "Snap"
    url: "https://careers.snap.com/jobs?type=Intern"
    # Verified: 4 jobs (its links are /job?id=R000... - a query-string id,
    # which the default link pattern handles). Shows one page at a time.
    scroll_times: 3

  - type: browser
    name: "TikTok"
    url: "https://lifeattiktok.com/search"
    # Verified: 12 jobs. Job links are /search/<id> - indistinguishable from
    # a search page by shape, so the pattern is pinned to their host.
    link_pattern: "lifeattiktok\\.com/search/\\d"
    scroll_times: 3

  - type: ashby
    name: "OpenAI"
    slug: "openai"    # verified: 750 postings via Ashby API (vs 14 by DOM scraping)

  - type: greenhouse
