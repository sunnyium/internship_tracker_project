  # ===========================================================================
  # The board-API sweep above can only reach companies small enough to use a
  # startup ATS, which left out most of the brand-name employers this profile
  # actually wants. Workday covers those, but its feed address has three parts
  # (tenant, host, site) and none is guessable from the company name, so these
  # were found by trying plausible combinations and keeping what answered.
  #
  # Each one was then read back: two real postings pulled off the board and
  # checked against the employer they were meant to be. "verified: 20+" is the
  # first page of results, not the board total - the fetcher pages through the
